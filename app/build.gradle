plugins {
    id 'com.android.application'
}

android {
    namespace 'org.motax.app'
    compileSdk 35

    defaultConfig {
        applicationId 'org.motax.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
